<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 40 920 1660" width="100%" height="100%">
  <defs>

    <!-- Ocean Water Texture Base 
    <radialGradient id="oceanGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3b727a"/>
      <stop offset="55%" stop-color="#2a585f"/>
      <stop offset="100%" stop-color="#143135"/>
    </radialGradient>-->

    <!-- Continental Land Parchment Texture --><linearGradient id="landGrad" x1="15%" y1="0%" x2="85%" y2="100%">
  <stop offset="0%" stop-color="#ebd2a7"/>
  <stop offset="100%" stop-color="#ebd2a7"/>
</linearGradient>

    <!-- Shallow Coastal Water Glow -->
    <filter id="coastalShallow" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="4" in="SourceAlpha" result="expanded"/>
      <feGaussianBlur stdDeviation="4" in="expanded" result="blur"/>
      <feFlood flood-color="#80c3cb" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shallowWater"/>
      <feMerge>
        <feMergeNode in="shallowWater"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow for Continental Depth -->
    <filter id="mapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#0a1719" flood-opacity="0.65"/>
    </filter>
 
  </defs>

  <!-- ==================== 1. OCEAN BACKGROUND ==================== -->
  <rect x="50" y="40" width="920" height="1660" fill="url(#oceanGrad)"/>

  <!-- ==================== 2. NAVIGATION RHUMB LINES ==================== -->
