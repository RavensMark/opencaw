    <line x1="500" y1="0" x2="500" y2="1800"/>
    <line x1="0" y1="900" x2="1000" y2="900"/>
    <line x1="0" y1="0" x2="1000" y2="1800"/>
    <line x1="1000" y1="0" x2="0" y2="1800"/>
    <circle cx="500" cy="900" r="400" fill="none"/>
    <circle cx="500" cy="900" r="750" fill="none"/>
  </g>

