<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 2048" role="img" aria-labelledby="title desc">
  <title id="title">Raven's Mark World Map</title>
  <desc id="desc">A parchment and ocean fantasy map inspired by the supplied Raven's Mark world map, with labelled regions and seas.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="5" seed="17" />
      <feColorMatrix type="saturate" values="0.35" />
      <feBlend in="SourceGraphic" mode="multiply" />
    </filter>
    <filter id="coast">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#9d7a2e" flood-opacity="0.75" />
    </filter>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174954" />
      <stop offset="0.5" stop-color="#2d6b70" />
      <stop offset="1" stop-color="#11343f" />
    </linearGradient>
    <radialGradient id="land" cx="45%" cy="45%" r="65%">
      <stop offset="0" stop-color="#f5e6bd" />
      <stop offset="1" stop-color="#d6b765" />
    </radialGradient>
    <style>
      .sea{fill:url(#sea)}.land{fill:url(#land);stroke:#a77d2e;stroke-width:4;filter:url(#coast)}
      .realm{fill-opacity:.28;stroke-width:5}.label{font:700 32px Cinzel,Georgia,serif;fill:#f3ead8;stroke:#102228;stroke-width:4;paint-order:stroke;text-anchor:middle}.small{font-size:19px}.city{fill:#201414;stroke:#f7e8c4;stroke-width:2}.route{fill:none;stroke:#172832;stroke-width:3;opacity:.45}.mount{fill:none;stroke:#564735;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.8}.dash{stroke-dasharray:14 12;fill-opacity:.22}.isle{fill:#e9cb7c;stroke:#a77d2e;stroke-width:2;filter:url(#coast)}
    </style>
  </defs>
  <rect class="sea" width="1152" height="2048" />
  <rect width="1152" height="2048" fill="#fff" opacity=".08" filter="url(#paper)" />
  <g class="routes">
    <path class="route" d="M0 310 C130 720 220 1050 430 1530"/><path class="route" d="M470 0 L470 2048"/><path class="route" d="M1045 0 C900 410 820 800 930 1340"/><path class="route" d="M0 1580 L1152 1580"/><path class="route" d="M50 2048 C330 1780 650 1620 1152 1490"/>
